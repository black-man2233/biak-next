services:
  app:
    build: .
    expose:
      - "3000"
    environment:
      DATABASE_URL: file:/app/data/biak.db
      NEXTAUTH_SECRET: a5a139c812e629ccba6f59a06c9d1d7c84ce6b3efb8870449c75765864158409
      NEXTAUTH_URL: https://biak.bamwesa.org
    volumes:
      - db_data:/app/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  db_data:
  caddy_data:
  caddy_config:
